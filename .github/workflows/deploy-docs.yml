name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'i18n/**'
      - 'src/**'
      - 'static/**'
      - 'sidebars.ts'
      - 'docusaurus.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy.sh'
      - '.github/workflows/deploy-docs.yml'

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, layero-builder]
    # 15m was chronically tight: install + ru/en build + yc + deploy + the
    # 36-retry CDN-propagation Verify routinely lands at ~14–15m and the
    # 2026-06-25 docs deploy was killed at 15m16s. Give real headroom.
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 — не перестраховка. Docusaurus берёт <lastmod> для
      # sitemap из даты последнего коммита файла; при клоне по умолчанию
      # (глубина 1) история недоступна, и у ВСЕХ страниц окажется одна и та же
      # дата — дата этого прогона. Такой sitemap хуже, чем вовсе без lastmod.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Внешние ссылки Docusaurus не проверяет вовсе — onBrokenLinks про
      # внутренние. Из-за этого в доках жила ссылка на файл приватного
      # репозитория, отдававшая 404 каждому читателю. Шаг валит сборку только
      # на 404/410; 403 и таймауты (защиты от ботов, флапы) — предупреждением.
      - name: Check external links
        run: python3 scripts/check-external-links.py

      - name: Build (ru + en)
        run: npm run build

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure yc
        env:
          YC_CDN_SA_KEY: ${{ secrets.YC_CDN_SA_KEY }}
        run: |
          install -m 600 /dev/null "$HOME/yc-sa-key.json"
          printf '%s' "$YC_CDN_SA_KEY" > "$HOME/yc-sa-key.json"
          yc config profile create ci 2>/dev/null || yc config profile activate ci
          yc config set service-account-key "$HOME/yc-sa-key.json"
          yc config set cloud-id b1ger5mmajemr152soru
          yc config set folder-id b1g5p8gs03eoj1fvu0qc
          yc storage bucket get layero-docs >/dev/null
          yc cdn resource get bc8r7guaub3kynogbziz >/dev/null

      - name: Deploy docs
        env:
          CDN_RESOURCE_ID: bc8r7guaub3kynogbziz
        run: bash deploy.sh

      - name: Verify
        run: |
          for i in $(seq 1 36); do
            if curl -sf https://docs.layero.ru/ | grep -q "Layero"; then
              echo "OK: docs.layero.ru returns content"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for CDN propagation" >&2
          exit 1
